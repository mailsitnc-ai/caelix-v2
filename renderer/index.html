<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CAELIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http://localhost:* http://127.0.0.1:* https:; script-src 'self'">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-drag"></div>
    <div class="sb-top">
      <button id="btn-new" class="primary-ghost" title="New session (⌘N)"><span class="plus">＋</span> New session</button>
      <input id="search" type="search" placeholder="Search sessions" autocomplete="off">
    </div>
    <div id="session-list"></div>
    <div class="sb-foot">
      <button id="btn-keys" class="ghost" title="Model provider keys"><span class="ic">⚿</span> Keys</button>
      <button id="btn-settings" class="ghost" title="Settings"><span class="ic">⚙</span> Settings</button>
    </div>
  </aside>
  <main id="main">
    <header id="titlebar">
      <button id="title" class="title-btn" title="Session menu"><span id="title-text">CAELIX</span><span class="caret">⌄</span></button>
      <div class="tb-spacer"></div>
      <div class="tb-icons">
        <button class="tbi" id="tb-rail" title="Show session rail" aria-label="Session rail">☰</button>
        <button class="tbi" id="tb-terminal" title="Terminal (⌃`)" aria-label="Terminal">&gt;_</button>
        <button class="tbi" id="tb-diff" title="Changes (⌘⇧D)" aria-label="Changes">±</button>
        <button class="tbi" id="tb-browser" title="Browser (⌘⇧B)" aria-label="Browser">◍</button>
        <button class="tbi" id="tb-files" title="Files" aria-label="Files">▢</button>
        <button class="tbi" id="tb-more" title="More" aria-label="More">⋯</button>
      </div>
    </header>
    <div id="body">
      <section id="chatcol" class="empty">
        <div id="chat"><div id="transcript"></div></div>
        <div id="newhead">
          <div class="mark"><img src="../assets/icons/icon-128.png" alt="CAELIX" width="56" height="56"></div>
          <h1>What should we work on?</h1>
        </div>
        <div id="composer-wrap">
          <div id="slash-menu" class="popup" hidden></div>
          <div id="queue"></div>
          <div id="composer">
            <button id="btn-plus" class="cbtn" title="Add files, skills, folders">＋</button>
            <textarea id="input" rows="1" placeholder="↵ to send, ⌘↵ to queue for later" spellcheck="false"></textarea>
            <button id="btn-stop" class="cbtn stop" title="Stop (Esc)" hidden><span class="sq"></span></button>
            <button id="btn-send" class="cbtn send" title="Send (↵)">↑</button>
            <button id="btn-mic" class="cbtn" title="Voice input is not available in CAELIX" disabled>🎙</button>
          </div>
          <div id="foot">
            <button id="chip-folder" class="chip" title="Project folder">▭ <span id="folder-name">Choose folder</span></button>
            <span class="grow"></span>
            <button id="chip-model" class="chip" title="Model (⌘⇧I)"><span id="model-name">Pick a model</span></button>
            <button id="chip-effort" class="chip" title="Effort (⌘⇧E)"><span id="effort-name">Medium</span></button>
            <button id="chip-mode" class="chip" title="Permission mode (⌘⇧M)"><span id="mode-name">Manual</span></button>
            <svg id="ctx-ring" width="18" height="18" viewBox="0 0 20 20" aria-label="Context"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--border)" stroke-width="2.4"/><circle id="ctx-arc" cx="10" cy="10" r="8" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="50.3" stroke-dashoffset="50.3" transform="rotate(-90 10 10)" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div id="popup-host"></div>
      </section>
      <section id="sidepane" hidden>
        <div class="sp-tabs" id="sp-tabs"></div>
        <div class="sp-body" id="sp-body"></div>
      </section>
      <aside id="rail" hidden></aside>
    </div>
  </main>
</div>
<div id="modal-host"></div>
<div id="toast" hidden></div>
<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
