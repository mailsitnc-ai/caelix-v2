<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CAELIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http://localhost:* http://127.0.0.1:* https:; script-src 'self'">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="orbs"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div>
<div id="app">
  <header id="topbar">
    <div class="tl-space"></div>
    <button class="tbi" id="tb-sidebar" title="Toggle sidebar" aria-label="Toggle sidebar">▥</button>
    <div class="brand"><img src="../assets/icons/icon-128.png" alt="" width="24" height="24"><span>CAELIX</span></div>
    <div class="seg" id="seg">
      <button id="seg-chat" class="on" title="Chat: no folder needed"><span>💬</span> Chat</button>
      <button id="seg-code" title="Code: works inside a project folder"><span>‹/›</span> Code</button>
    </div>
    <button class="pill" id="chip-folder-top" title="Project folder" hidden><span>▭</span> <b id="folder-top-name">Open folder</b> <i>⌄</i></button>
    <button id="title-btn" class="title-btn" title="Rename"><span id="title-text">New chat</span><span class="pen">✎</span></button>
    <div class="tb-spacer"></div>
    <button class="pill" id="chip-mode-top" title="Permission mode (⌘⇧M)">Manual</button>
    <button class="pill" id="chip-team" title="Team mode: split work across sub-agents">Team</button>
    <button class="pill wide" id="chip-model-top" title="Model (⌘⇧I)">Pick a model</button>
    <button class="pill" id="chip-view" title="Transcript view (⌃O)">Normal</button>
    <button class="tbi round" id="btn-window" title="New window (⇧⌘N): work on another task side by side" aria-label="New window">⧉</button>
    <button class="tbi round" id="btn-update" title="Check for updates" aria-label="Check for updates">⟳<i class="dotbadge" hidden></i></button>
    <button class="tbi round" id="btn-theme" title="Light / dark" aria-label="Theme">◐</button>
    <button class="pill" id="btn-mcp" title="MCP servers (/mcp)">MCP</button>
    <button class="pill" id="btn-hooks" title="Lifecycle hooks (/hooks)">Hooks</button>
    <button class="pill" id="btn-browser" title="Browser (⌘⇧B)">Browser</button>
    <button class="pill" id="btn-keys" title="Provider keys (/keys)">Keys</button>
    <button class="tbi" id="btn-panel" title="Right panel" aria-label="Right panel">◧</button>
  </header>
  <div id="shell">
    <aside id="sidebar">
      <div class="sb-top">
        <button id="btn-new" class="glass-btn"><span class="plus">＋</span> <span id="new-label">New chat</span></button>
        <div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search chats" autocomplete="off"></div>
      </div>
      <div id="session-list"></div>
      <div class="sb-foot">
        <button class="foot-row" id="foot-folder" hidden><i class="sq"></i><span id="foot-folder-name"></span></button>
        <button class="foot-row" id="foot-memory"><span class="ic">▤</span><span>Project memory</span><b id="mem-count">0</b></button>
        <div class="foot-note">Keys are encrypted by your system and stay on this computer.</div>
      </div>
    </aside>
    <main id="main">
      <section id="chatcol" class="empty">
        <div id="chat"><div id="transcript"></div></div>
        <div id="newhead">
          <img src="../assets/icons/icon-256.png" alt="CAELIX" width="72" height="72">
          <h1 id="new-title">What can I help with?</h1>
          <div id="new-sub"></div>
          <div id="new-folder" hidden>
            <button class="glass-btn big" id="btn-open-folder">▭ Open a project folder</button>
            <div id="recent-folders"></div>
          </div>
        </div>
        <div id="composer-wrap">
          <div id="slash-menu" class="popup" hidden></div>
          <div id="banner" class="banner warn" hidden></div>
          <div id="queue"></div>
          <div id="composer">
            <div id="keyban" class="keyban" hidden><span id="keyban-text"></span><button class="mini" id="keyban-open">Open Keys</button></div>
            <div id="attach-strip" hidden></div>
            <textarea id="input" rows="1" placeholder="Ask CAELIX anything — MCP, Skills, Hooks & Agents stay active (/ commands)" spellcheck="false"></textarea>
            <div class="crow">
              <button class="cbtn" id="btn-plus" title="Attach files, folders, skills">📎</button>
              <button class="cpill" id="btn-cmds">/ Commands</button>
              <button class="cpill" id="btn-agents">Agents</button>
              <button class="cpill" id="chip-mode">Manual</button>
              <button class="cpill wide" id="chip-model"><span id="model-name">Pick a model</span></button>
              <span class="grow"></span>
              <button id="btn-stop" class="send stop" title="Stop (Esc)" hidden><span class="sq"></span></button>
              <button id="btn-send" class="send" title="Send (↵)">↑</button>
            </div>
          </div>
          <div id="foot">
            <span id="foot-left">CAELIX</span><span class="chipb" id="foot-branch" hidden>main</span><span id="foot-ctx">0% context</span>
            <span class="grow"></span><span>CAELIX can make mistakes. Review changes.</span>
          </div>
        </div>
      </section>
      <section id="sidepane" hidden>
        <div class="sp-tabs" id="sp-tabs"></div>
        <div class="sp-body" id="sp-body"></div>
      </section>
    </main>
  </div>
</div>
<div id="modal-host"></div>
<div id="toast" hidden></div>
<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
